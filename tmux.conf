###############
# TMUX CONFIG #
###############

# Basic settings
set -g default-terminal "screen-256color"
set -s escape-time 0

# Notifications
set -g monitor-bell on
set -g window-status-bell-style 'fg=#ff7f86,bold'

# Pass modified keys (Shift+Enter, Ctrl+Enter, ...) through as CSI u instead of
# flattening them to their unmodified form. Needed for Shift+Enter in Claude Code.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Set prefix to Control+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -n C-k clear-history

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift+Arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift+Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Kill current session
bind X confirm-before kill-session

# Rename the current window (prefix + r). tmux turns automatic-rename off for
# the window as a side effect, so a manual name sticks until the window closes.
bind r command-prompt -I "#W" "rename-window '%%'"

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded TMUX Config!"

bind C-Enter command-prompt

# Switch sessions
bind '>' switch-client -n
bind '<' switch-client -p

# Toggle a per-session scratch popup with prefix + ,.
# Each parent session keeps its own scratch session named "_scratch_<parent>",
# so cwd, running processes, and shell history persist across toggles within
# that session. From inside the popup, prefix + , detaches (which closes it,
# leaving the scratch session running in the background for next time).
bind ',' if -F '#{m:_scratch_*,#{session_name}}' {
  detach-client
} {
  display-popup -d '#{pane_current_path}' \
    -x '#{e|*|f|0:#{window_width},0.53}' -y C \
    -w 47% -h 100% \
    -E "tmux new-session -A -s '_scratch_#{session_name}'"
}

# Toggle the popup's size between 47% (default) and 100% with prefix + ..
# Pressing . closes the current popup and reopens it on the parent client at the
# new size. Outside the popup, . just opens the popup at the toggled size.
set -gq @scratch_full 0
bind '.' run-shell '
  current="#{session_name}"
  client="#{client_name}"
  full=$(tmux show-option -gv @scratch_full 2>/dev/null || echo 0)

  if [ "$full" = "1" ]; then
    tmux set-option -gq @scratch_full 0
    new_full=0
  else
    tmux set-option -gq @scratch_full 1
    new_full=1
  fi

  case "$current" in
    _scratch_*)
      target="$current"
      parent=$(tmux list-clients -F "##{client_name}" | grep -vx "$client" | head -n 1)
      [ -z "$parent" ] && exit
      ww=$(tmux display-message -t "$parent" -p "##{window_width}")
      tmux detach-client -t "$client"
      set -- -c "$parent"
      ;;
    *)
      target="_scratch_${current}"
      tmux has-session -t "$target" 2>/dev/null || tmux new-session -d -s "$target"
      ww="#{window_width}"
      set --
      ;;
  esac

  if [ "$new_full" = "1" ]; then
    tmux display-popup "$@" -x 0 -y 0 -w 100% -h 100% \
      -E "tmux new-session -A -s $target"
  else
    x=$(( ww * 6 / 10 ))
    tmux display-popup "$@" -x "$x" -y C -w 40% -h 100% \
      -E "tmux new-session -A -s $target"
  fi
'

# Use Vim keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Enable mouse
set -g mouse on

# Increase scroll limit
set -g history-limit 1000000


#########
# THEME #
#########
# Follows the system theme: Modus Operandi Tinted in light mode, Modus Vivendi
# Tinted in dark. dotbar bakes its colours into the status line when it runs,
# so each hook sets them and runs it again.
set -g @tmux-dotbar-bg "#0d0e1c"
set -g @tmux-dotbar-fg "#61647a"
set -g @tmux-dotbar-fg-current "#2fafff"
set -g @tmux-dotbar-fg-session "#989898"
set -g @tmux-dotbar-fg-prefix "#f78fe7"

set-hook -g client-light-theme {
  set -g @tmux-dotbar-bg "#fbf7f0"
  set -g @tmux-dotbar-fg "#9f9690"
  set -g @tmux-dotbar-fg-current "#0031a9"
  set -g @tmux-dotbar-fg-session "#595959"
  set -g @tmux-dotbar-fg-prefix "#8f0075"
  run-shell "~/.config/tmux/plugins/tpm/tmux-dotbar/dotbar.tmux"
}
set-hook -g client-dark-theme {
  set -g @tmux-dotbar-bg "#0d0e1c"
  set -g @tmux-dotbar-fg "#61647a"
  set -g @tmux-dotbar-fg-current "#2fafff"
  set -g @tmux-dotbar-fg-session "#989898"
  set -g @tmux-dotbar-fg-prefix "#f78fe7"
  run-shell "~/.config/tmux/plugins/tpm/tmux-dotbar/dotbar.tmux"
}
# The theme hooks fire only on a change, so apply the current theme on attach.
set-hook -g client-attached {
  if -F "#{==:#{client_theme},light}" "set-hook -R client-light-theme" "set-hook -R client-dark-theme"
}

# Set position of dotbar to top
set -g @tmux-dotbar-position top

# Window list: just the name, no index, no divider. tmux-dotbar owns
# window-status-format, so it has to be configured through its own option
# rather than window-status-format directly (tpm runs last and would win).
set -g @tmux-dotbar-window-status-format " #W "
set -g @tmux-dotbar-bold-current-window true


###########################
# CUSTOM TITLES & FORMATS #
###########################

# Window titles.
#
# allow-rename stays off so a stray escape sequence from a program cannot
# rewrite the title. automatic-rename is on so the name tracks what the pane is
# actually doing, and prefix + r overrides it permanently for that window.
set-option -g allow-rename off
set-window-option -g automatic-rename on

# Name resolution, in order:
#   1. a bare version number -> "claude" (Claude Code renames its own process
#      to its version string, so that is what pane_current_command reports)
#   2. anything else -> the command name, e.g. zsh, nvim, lazygit, htop
set-window-option -g automatic-rename-format "#{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}"
# tmux 3.8 underlines the current window by default
set-window-option -g window-status-current-style default

# Pane titles: off by default
set -g pane-border-status off
set -g pane-border-format " #{?#{m:[0-9]*,#{pane_current_command}},claude,#{pane_current_command}} "

# Show pane titles only if more than one pane
set-hook -g after-split-window 'run-shell "if [ $(tmux list-panes -F \"#{window_panes}\" | wc -l) -gt 1 ]; then tmux setw -t #{session_name}:#{window_index} pane-border-status top; else tmux setw -t #{session_name}:#{window_index} pane-border-status off; fi"'
set-hook -g after-kill-pane  'run-shell "if [ $(tmux list-panes -F \"#{window_panes}\" | wc -l) -gt 1 ]; then tmux setw -t #{session_name}:#{window_index} pane-border-status top; else tmux setw -t #{session_name}:#{window_index} pane-border-status off; fi"'





###############
# TMUX PLUGINS #
###############

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/tpm'

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Plugins
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-pain-control' 
set -g @plugin 'tmux-plugins/tmux-sensible' 
set -g @plugin 'tmux-plugins/tmux-yank' 
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'


#######################
# INITIALIZE PLUGINS
#######################
run '~/.config/tmux/plugins/tpm/tpm'



###############
# TMUX CONFIG #
###############

# Basic settings
set -g default-terminal "screen-256color"
set -s escape-time 0

# Set prefix to Control+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -n C-k clear-history

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift+Arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift+Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Kill current session
bind X confirm-before kill-session

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded TMUX Config!"

bind C-Enter command-prompt

# Switch sessions
bind '>' switch-client -n
bind '<' switch-client -p

# Toggle a per-session scratch popup with prefix + ,.
# Each parent session keeps its own scratch session named "_scratch_<parent>",
# so cwd, running processes, and shell history persist across toggles within
# that session. From inside the popup, prefix + , detaches (which closes it,
# leaving the scratch session running in the background for next time).
bind ',' if -F '#{m:_scratch_*,#{session_name}}' {
  detach-client
} {
  display-popup -d '#{pane_current_path}' \
    -x '#{e|*|f|0:#{window_width},0.6}' -y C \
    -w 40% -h 100% \
    -E "tmux new-session -A -s '_scratch_#{session_name}'"
}

# Toggle the popup's size between 40% (default) and 100% with prefix + F.
# Pressing F closes the current popup and reopens it on the parent client at the
# new size. Outside the popup, F just opens the popup at the toggled size.
set -gq @scratch_full 0
bind 'F' run-shell '
  current="#{session_name}"
  client="#{client_name}"
  full=$(tmux show-option -gv @scratch_full 2>/dev/null || echo 0)

  if [ "$full" = "1" ]; then
    tmux set-option -gq @scratch_full 0
    new_full=0
  else
    tmux set-option -gq @scratch_full 1
    new_full=1
  fi

  case "$current" in
    _scratch_*)
      target="$current"
      parent=$(tmux list-clients -F "##{client_name}" | grep -vx "$client" | head -n 1)
      [ -z "$parent" ] && exit
      ww=$(tmux display-message -t "$parent" -p "##{window_width}")
      client_arg="-c $parent"
      chain_detach="detach-client -t $client \\;"
      ;;
    *)
      target="_scratch_${current}"
      tmux has-session -t "$target" 2>/dev/null || tmux new-session -d -s "$target"
      ww="#{window_width}"
      client_arg=""
      chain_detach=""
      ;;
  esac

  if [ "$new_full" = "1" ]; then
    eval tmux $chain_detach display-popup $client_arg -x 0 -y 0 -w 100% -h 100% \
      -E "\"tmux new-session -A -s $target\""
  else
    x=$(( ww * 6 / 10 ))
    eval tmux $chain_detach display-popup $client_arg -x $x -y C -w 40% -h 100% \
      -E "\"tmux new-session -A -s $target\""
  fi
'

# Use Vim keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Enable mouse
set -g mouse on

# Increase scroll limit
set -g history-limit 1000000


#########
# THEME #
#########
# Modus Operandi Tinted
set -g @tmux-dotbar-bg "#fbf7f0"
set -g @tmux-dotbar-fg "#9f9690"
set -g @tmux-dotbar-fg-current "#000000"
set -g @tmux-dotbar-fg-session "#595959"
set -g @tmux-dotbar-fg-prefix "#8f0075"

# Set position of dotbar to top
set -g @tmux-dotbar-position top


###########################
# CUSTOM TITLES & FORMATS #
###########################

# Window titles (disable automatic renaming)
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Window status: x | dir_name
set-window-option -g window-status-format " #I | #{b:pane_current_path##*/} "
set-window-option -g window-status-current-format "#[bold]#I | #{b:pane_current_path##*/} #[default]"

# Pane titles: off by default
set -g pane-border-status off
set -g pane-border-format " #{pane_index} | #{b:pane_current_path##*/} "

# Show pane titles only if more than one pane
set-hook -g after-split-window 'run-shell "if [ $(tmux list-panes -F \"#{window_panes}\" | wc -l) -gt 1 ]; then tmux setw -t #{session_name}:#{window_index} pane-border-status top; else tmux setw -t #{session_name}:#{window_index} pane-border-status off; fi"'
set-hook -g after-kill-pane  'run-shell "if [ $(tmux list-panes -F \"#{window_panes}\" | wc -l) -gt 1 ]; then tmux setw -t #{session_name}:#{window_index} pane-border-status top; else tmux setw -t #{session_name}:#{window_index} pane-border-status off; fi"'


###############
# TMUX PLUGINS #
###############

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/tpm'

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Plugins
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-pain-control' 
set -g @plugin 'tmux-plugins/tmux-sensible' 
set -g @plugin 'tmux-plugins/tmux-yank' 

#######################
# INITIALIZE PLUGINS
#######################
run '~/.config/tmux/plugins/tpm/tpm'

